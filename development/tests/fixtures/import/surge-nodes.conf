[Proxy]
Surge SS = ss, ss.example.com, 8388, encrypt-method=aes-128-gcm, password=password, obfs=http, obfs-host=cdn.example.com
Surge Trojan = trojan, trojan.example.com, 443, password=trojan-password, sni=trojan.example.com, skip-cert-verify=false
Surge Snell = snell, snell.example.com, 443, psk=snell-password, version=4, reuse=true, obfs=http, obfs-host=snell.example.com
Surge TUIC = tuic, tuic.example.com, 443, token=tuic-password, alpn=h3
Surge Hysteria = hysteria2, hysteria.example.com, 443, password=hy2-password, download-bandwidth=100, port-hopping=2000-3000, port-hopping-interval=30, salamander-password=hy2-obfs
Surge AnyTLS = anytls, anytls.example.com, 443, password=anytls-password, sni=anytls.example.com
